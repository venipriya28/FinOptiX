name: FinOptiX CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: finoptix
          POSTGRES_USER: finoptix
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finoptix -d finoptix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FINOPTIX_DATABASE_URL: postgresql://finoptix:ci-only-password@localhost:5432/finoptix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Backend tests (including PostgreSQL round trip)
        working-directory: backend
        run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        working-directory: frontend
        run: pnpm build
      - name: Build API container
        run: docker build -t finoptix-api:ci .
      - name: Build frontend container
        run: docker build -f Dockerfile.frontend -t finoptix-frontend:ci .
